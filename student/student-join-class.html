<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join a class — Bored Academy</title>
  <link rel="icon" href="../favicon.webp?v=2" sizes="any">
  <link rel="icon" type="image/webp" href="../assets/img/favicon.webp?v=2">
  <link rel="apple-touch-icon" href="../assets/img/favicon.webp?v=2">
  <link rel="stylesheet" href="../assets/css/welcome.css">
  <script src="../assets/js/firebase/firebase-config.js"></script>
  <script src="../assets/js/firebase/firestore.js"></script>
  <script src="../assets/js/auth/auth.js"></script>
  <script src="../assets/js/auth/roles.js"></script>
  <script src="../assets/js/classroom/classroom.js"></script>
  <script src="../assets/js/app/router.js"></script>
  <script src="../assets/js/app/theme.js"></script>
</head>
<body class="dash-page welcome-page">

<script>
  if(!window.BoredAuth || !BoredAuth.currentUser()){
    window.location.href = (window.BoredAuth.rootRelative ? window.BoredAuth.rootRelative('auth.html?mode=login') : '../auth.html?mode=login');
  }
</script>

<header class="welcome-topbar">
  <a class="welcome-brand" href="../welcome.html">
    <img src="../assets/img/logo.webp" alt="Bored Academy logo" width="30" height="30">
    <span>Bored Academy</span>
  </a>
</header>

<main class="auth-shell">
  <div class="auth-card onboarding-card">
    <div class="onboarding-icon">🎓</div>
    <h2>Join a class</h2>
    <p class="auth-hint">Enter the class code your teacher gave you. You can skip this and join later from Settings.</p>

    <form id="joinForm" class="auth-form" style="margin-top:1.2em;">
      <label>Class code
        <input type="text" id="classCode" placeholder="ABCX-93KD" autocomplete="off" style="text-transform:uppercase;letter-spacing:.08em;">
      </label>
      <div class="auth-error" id="joinError" style="min-height:1.4em;"></div>
      <button type="submit" class="welcome-btn full">Join class</button>
      <button type="button" class="welcome-link-btn full" id="skipBtn" style="margin-top:.6em;">Skip for now</button>
    </form>
  </div>
</main>

<script>
  const user = BoredAuth.currentUser();
  const joinForm = document.getElementById('joinForm');
  const classCodeInput = document.getElementById('classCode');
  const joinError = document.getElementById('joinError');
  const skipBtn = document.getElementById('skipBtn');

  joinForm.addEventListener('submit', function(e){
    e.preventDefault();
    joinError.textContent = '';
    const code = classCodeInput.value.trim();
    if(!code){
      joinError.textContent = 'Please enter a class code.';
      return;
    }
    if(!window.BoredClassroom){
      joinError.textContent = 'Classroom is not loaded. Please refresh.';
      return;
    }
    const result = BoredClassroom.joinClass(user.email, code);
    if(!result.ok){
      joinError.textContent = result.error;
      return;
    }
    BoredAuth.addClass(user.email, result.class.id);
    BoredAuth.markOnboardingDone();
    window.location.href = '../student/student-dashboard.html';
  });

  skipBtn.addEventListener('click', function(){
    BoredAuth.markOnboardingDone();
    window.location.href = '../student/student-dashboard.html';
  });

  classCodeInput.addEventListener('input', function(){
    this.value = this.value.toUpperCase().replace(/[^A-Z0-9-]/g, '');
  });
</script>

</body>
</html>
