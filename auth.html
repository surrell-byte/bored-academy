<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Bored Academy</title>
<link rel="icon" href="favicon.webp?v=2" sizes="any">
<link rel="icon" type="image/webp" href="assets/img/favicon.webp?v=2">
<link rel="apple-touch-icon" href="assets/img/favicon.webp?v=2">
<link rel="stylesheet" href="assets/css/dashboard.css">
<link rel="stylesheet" href="assets/css/welcome.css">
<script src="assets/js/firebase/firebase-config.js"></script>
<script src="assets/js/firebase/firestore.js"></script>
<!-- BOREDACADEMY_SIGNUP_PATCH -->
<script src="assets/js/auth/roles.js"></script>
<script src="assets/js/auth/permissions.js"></script>
<script src="assets/js/auth/auth.js"></script>
<script src="assets/js/classroom/classroom.js"></script>
<script src="assets/js/app/router.js"></script>
<script src="assets/js/app/theme.js"></script>
</head>
<body class="dash-page welcome-page">

<script>
  if(window.BoredAuth){
    const visitingUser = BoredAuth.currentUser();
    if(visitingUser && !BoredAuth.isGuest(visitingUser)){
      if(window.BoredRouter){ BoredRouter.goToDashboard(visitingUser); }
      else { window.location.href = 'index.html'; }
    }
  }
</script>

<header class="welcome-topbar">
  <a class="welcome-brand" href="welcome.html">
    <img src="assets/img/logo.webp" alt="Bored Academy logo" width="30" height="30">
    <span>Bored Academy</span>
  </a>
</header>

<main class="auth-shell">
  <div class="auth-card">
    <div class="auth-tabs">
      <button type="button" class="auth-tab" data-tab="login" aria-selected="true">Log In</button>
      <button type="button" class="auth-tab" data-tab="signup" aria-selected="false">Sign Up</button>
    </div>

    <form id="loginForm" class="auth-form">
      <h2>Welcome back</h2>
      <p class="auth-hint">Log in to pick up right where you left off.</p>
      <label>Email
        <input type="email" id="loginEmail" required autocomplete="email">
      </label>
      <label>Password
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </label>
      <div class="auth-error" id="loginError"></div>
      <button type="submit" class="welcome-btn full">Log In</button>
    </form>

    <form id="signupForm" class="auth-form" style="display:none">
      <h2>Create your account</h2>
      <p class="auth-hint">Free — takes about 20 seconds.</p>

      <label>I am a...</label>
      <div class="account-type-toggle" id="accountTypeToggle" role="group" aria-label="Account type">
        <button type="button" class="auth-tab active" data-account-type="student">Student</button>
        <button type="button" class="auth-tab" data-account-type="teacher">Teacher</button>
      </div>

      <label>Name
        <input type="text" id="signupName" required autocomplete="name">
      </label>
      <label>Email
        <input type="email" id="signupEmail" required autocomplete="email">
      </label>
      <label>Password
        <input type="password" id="signupPassword" required autocomplete="new-password" minlength="6">
        <span class="auth-field-hint">At least 6 characters.</span>
      </label>
      <label id="classCodeLabel">Class code <span class="auth-field-hint">(optional — your teacher gives you this)</span>
        <input type="text" id="signupClassCode" placeholder="ABCX-93KD" autocomplete="off">
      </label>
      <div class="auth-error" id="signupError"></div>
      <button type="submit" class="welcome-btn full">Create Account</button>
    </form>

    <p class="auth-fineprint" id="authFineprint">
      This runs entirely in your browser — your account is stored on this device only, not on a server.
    </p>
    <!-- BOREDACADEMY_AUTH_HTML_FIX -->
  </div>
</main>

<script>
  const loginForm = document.getElementById('loginForm');
  const signupForm = document.getElementById('signupForm');
  const tabs = document.querySelectorAll('[data-tab]');

  function showTab(name){
    tabs.forEach(t=>{
      const selected = t.dataset.tab === name;
      t.classList.toggle('active', selected);
      t.setAttribute('aria-selected', String(selected));
    });
    loginForm.style.display = name==='login' ? '' : 'none';
    signupForm.style.display = name==='signup' ? '' : 'none';
    document.getElementById(name === 'login' ? 'loginEmail' : 'signupName').focus();
  }
  tabs.forEach(t=> t.addEventListener('click', ()=> showTab(t.dataset.tab)));

  const params = new URLSearchParams(location.search);
  showTab(params.get('mode') === 'signup' ? 'signup' : 'login');

  loginForm.addEventListener('submit', function(e){
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    const errEl = document.getElementById('loginError');
    errEl.textContent = '';
    const result = BoredAuth.login(email, password);
    if(!result.ok){
      errEl.textContent = result.error;
      document.getElementById('loginPassword').focus();
      return;
    }
    goToDashboardOrHome(result.user);
  });

  // --- account type toggle (student/teacher) --------------------------
  let accountType = 'student';
  const accountTypeToggle = document.getElementById('accountTypeToggle');
  const classCodeLabel = document.getElementById('classCodeLabel');
  function setAccountType(type){
    accountType = type;
    accountTypeToggle.querySelectorAll('.auth-tab').forEach(function(btn){
      btn.classList.toggle('active', btn.dataset.accountType === type);
    });
    classCodeLabel.style.display = type === 'student' ? '' : 'none';
  }
  accountTypeToggle.querySelectorAll('.auth-tab').forEach(function(btn){
    btn.addEventListener('click', function(){ setAccountType(btn.dataset.accountType); });
  });

  signupForm.addEventListener('submit', function(e){
    e.preventDefault();
    const name = document.getElementById('signupName').value;
    const email = document.getElementById('signupEmail').value;
    const password = document.getElementById('signupPassword').value;
    const classCode = document.getElementById('signupClassCode').value.trim();
    const errEl = document.getElementById('signupError');
    errEl.textContent = '';

    const result = BoredAuth.signUp(name, email, password, accountType);
    if(!result.ok){
      errEl.textContent = result.error;
      document.getElementById('signupEmail').focus();
      return;
    }

    if(accountType === 'student' && classCode && window.BoredClassroom){
      const joinResult = BoredClassroom.joinClass(result.user.email, classCode);
      if(joinResult.ok){
        BoredAuth.addClass(result.user.email, joinResult.class.id);
      } else {
        errEl.textContent = joinResult.error + ' Your account was created — you can join a class later from Settings.';
        document.getElementById('signupClassCode').focus();
      }
    }

    BoredAuth.markOnboardingDone();
    if(accountType === 'teacher'){
      window.location.href = 'teacher/teacher-access.html';
    } else {
      window.location.href = 'student/student-join-class.html';
    }
  });

  function goToDashboardOrHome(user){
    if(!user) return;
    const isTeacher = window.BoredRoles && (BoredRoles.isTeacher(user.role) || BoredRoles.isAdmin(user.role));
    if(BoredAuth.needsOnboarding()){
      if(isTeacher){
        window.location.href = 'teacher/teacher-access.html';
      } else {
        window.location.href = 'student/student-join-class.html';
      }
      return;
    }
    if(window.BoredRouter){ BoredRouter.goToDashboard(user); }
    else { window.location.href = 'index.html'; }
  }

  // Update fineprint if Firebase is available
  (function updateFineprint(){
    const el = document.getElementById('authFineprint');
    if(!el) return;
    if(window.BoredFirebase && window.BoredFirebase.isEnabled && window.BoredFirebase.isEnabled()){
      el.textContent = 'Your account is stored locally and synced to the cloud so you can log in from any device.';
    }
  })();
</script>
</body>
</html>
